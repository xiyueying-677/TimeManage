[package]
name = "timemanage"
version = "0.1.0"
description = "番茄钟 + 倒计时日历"
authors = ["xiyueying"]
license = "MIT"
repository = "https://github.com/xiyueying-677/TimeManage"
edition = "2021"

[lib]
name = "timemanage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-timer-notification = { path = "plugins/timer-notification" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# 桌面专属依赖：Android 上没有托盘/单实例/原生文件对话框
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
rfd = "0.15"

# Android 文件导入/导出：系统 SAF（dialog + fs 插件）
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-fs = "=2.5.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
