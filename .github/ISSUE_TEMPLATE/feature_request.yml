name: 功能建议
description: 提出新功能或体验改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: background
    attributes:
      label: 需求背景
      description: 什么场景下需要这个功能？现在是怎么解决的？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它怎么工作？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 考虑过其他做法吗？
    validations:
      required: false
  - type: dropdown
    id: platform
    attributes:
      label: 涉及平台
      options:
        - Windows
        - Android
        - 两者都有
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 其他信息
    validations:
      required: false
