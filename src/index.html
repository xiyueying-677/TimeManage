<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>时间管理</title>
    <script>
      document.documentElement.dataset.platform = /Android/i.test(navigator.userAgent)
        ? "android"
        : "desktop";
    </script>
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/mobile.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="logo">🍅</div>
          <div>
            <div class="name">时间管理</div>
            <div class="sub">番茄钟 · 倒计时</div>
          </div>
        </div>
        <button class="nav-btn active" data-view="pomodoro">
          <span class="ico">🍅</span>番茄钟
        </button>
        <button class="nav-btn" data-view="stats">
          <span class="ico">📊</span>统计
        </button>
        <button class="nav-btn" data-view="calendar">
          <span class="ico">📅</span>倒计时
        </button>
        <button class="nav-btn" data-view="settings">
          <span class="ico">⚙️</span>设置
        </button>
        <div class="sidebar-foot">
          <button class="btn ghost small desktop-only" id="floatPomodoroBtn">悬挂番茄钟</button>
          <button class="btn ghost small desktop-only" id="floatCountdownBtn">悬挂倒计时</button>
          <div class="mini desktop-only">数据存于程序目录 data/</div>
        </div>
      </aside>
      <main class="content">
        <section class="view active" id="view-pomodoro"></section>
        <section class="view" id="view-stats"></section>
        <section class="view" id="view-calendar"></section>
        <section class="view" id="view-settings"></section>
      </main>
    </div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
